services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: health-tracking-container
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Admin123!
      - MSSQL_PID=Developer
    ports:
      - "1440:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - country-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Admin123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build: .
    container_name: health-tracking-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://mssql:1433;databaseName=health-tracking-db;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_URL=${LLM_URL}
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - country-network
volumes:
  mssql_data:
    driver: local

networks:
  country-network:
    driver: bridge
